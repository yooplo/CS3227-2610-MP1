plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'movietracker'
version = '0.1.0-SNAPSHOT'

def requestedJavafxPlatform = providers.gradleProperty('javafxPlatform')

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = '25.0.2'
    modules = ['javafx.controls']
    if (requestedJavafxPlatform.isPresent()) {
        platform = requestedJavafxPlatform.get()
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.5'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'movietracker.Launcher'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('cleanReleaseJars') {
    group = 'distribution'
    description = 'Removes prior MP1 release JARs while preserving release/.gitkeep.'
    outputs.upToDateWhen { false }
    doLast {
        fileTree(layout.projectDirectory.dir('release')) {
            include '*.jar'
        }.files.each { releaseJarFile ->
            delete releaseJarFile
        }
    }
}

tasks.register('releaseJar', Jar) {
    group = 'distribution'
    description = 'Builds the executable, platform-specific MP1 submission JAR.'
    dependsOn tasks.named('cleanReleaseJars'), tasks.named('test')

    archiveFileName = 'MovieTracker.jar'
    destinationDirectory = layout.projectDirectory.dir('release')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    manifest {
        attributes(
                'Main-Class': 'movietracker.Launcher',
                'Implementation-Title': 'Movie Tracker',
                'Implementation-Version': project.version,
                'Enable-Native-Access': 'ALL-UNNAMED',
                'JavaFX-Target-Platform': requestedJavafxPlatform.orElse(
                        "current-${System.getProperty('os.name')}-${System.getProperty('os.arch')}").get())
    }

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }

    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}
